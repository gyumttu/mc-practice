<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MC 연습 코치</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2b2a33;--mute:#8a8697;--pri:#ff7a45;--pri2:#ffe3d3;--ok:#2aa86b;--line:#f0e2cf;--hunter:#3b82f6;--mc2:#a855f7;--okbg:#e6f6ec;--fixbg:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1a22;--card:#272430;--ink:#f1eef7;--mute:#9b97a8;--pri2:#4a3228;--line:#3a3646;--okbg:#1f3a2b;--fixbg:#3d3216}}
:root[data-theme="dark"]{--bg:#1c1a22;--card:#272430;--ink:#f1eef7;--mute:#9b97a8;--pri2:#4a3228;--line:#3a3646;--okbg:#1f3a2b;--fixbg:#3d3216}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.sub{color:var(--mute);margin:0 0 10px;font-size:14px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
details label{display:block;margin:8px 0;font-size:14px}
input,select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 14px;background:var(--pri2);color:var(--ink);cursor:pointer}
button.on,button.pri{background:var(--pri);color:#fff}
button[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:10px 0}
#dots{display:flex;gap:6px;margin-bottom:12px}#dots span{flex:1;height:8px;border-radius:4px;background:var(--line)}#dots .d{background:var(--ok)}#dots .c{background:var(--pri)}
#who{display:inline-block;padding:2px 12px;border-radius:99px;color:#fff;font-size:13px;font-weight:700;background:var(--mute)}
#text{font-size:22px;line-height:1.65;margin:10px 0;font-weight:600;word-break:keep-all}
#tip{font-size:14px;color:var(--mute)}
#live{font-size:14px;color:var(--mute);min-height:20px;font-style:italic}
.meter{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .08s}
#status{font-weight:700;min-height:26px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.row button{flex:1 1 42%}
.fb{border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px}.fb.ok{background:var(--okbg)}.fb.fix{background:var(--fixbg)}
.note{font-size:12px;color:var(--mute)}
</style></head><body><main>
<h1>🎤 MC 연습 코치</h1>
<p class="sub">2026 MC Script Part 2 · MC1 = Hunter, MC2 = Claude</p>
<details><summary>⚙️ 설정</summary>
<label>MC1 이름 (Hunter)<input id="n1" value="Hunter"></label>
<label>MC2 이름 (Claude가 말할 이름)<input id="n2" value="Emily"></label>
<label>영어 속도<select id="rate"><option value="0.8">천천히</option><option value="0.95" selected>보통</option><option value="1.05">빠르게</option></select></label>
<label>외우기 단계<select id="lvl"><option value="1">1단계 · 보고 읽기</option><option value="2">2단계 · 첫 글자 힌트</option><option value="3">3단계 · 완전히 외우기</option></select></label>
<label>음량 측정(큰 소리 판단)<select id="mt"><option value="1">켜기</option><option value="0">끄기 (아이패드·아이폰 기본)</option></select></label>
</details>
<nav class="tabs"><button id="t1" class="on">📜 대본 연습</button><button id="t2">👥 관객 질문</button></nav>
<div class="card">
<div id="dots"></div>
<span id="who"></span>
<div id="text"></div>
<div id="tip"></div>
</div>
<div class="meter"><i id="bar"></i></div>
<div id="live"></div>
<div id="status"></div>
<div class="row">
<button id="bStart" class="pri">▶ 연습 시작</button>
<button id="bModel">🔊 시범 듣기</button>
<button id="bRec" class="pri">🎙 말하기</button>
<button id="bStop" class="pri">다 말했어요 ✋</button>
<button id="bHint">💡 힌트 보기</button>
<button id="bAsk">🔁 질문 다시 듣기</button>
<button id="bNext">➡ 다음으로</button>
</div>
<div id="res"></div>
<p class="note">Chrome·Safari 권장. 마이크 허용이 필요해요. 큰 소리 판단은 마이크 환경에 따라 조금 다를 수 있어요. 마이크가 막히면 소리 듣기와 따라 말하기만 쓸 수 있어요.</p>
</main>
<script>
const $=s=>document.querySelector(s);
const L=[
{w:'MC1',t:'Good evening! My name is {n1}.',tip:'웃으면서 활기차게 시작! 이름은 또박또박, 이름에 힘을 주세요.'},
{w:'MC2',t:'My name is {n2}. We want to share what a wonderful year we had here at Harvard.'},
{w:'MC1',t:'This year was amazing! We did so many wonderful things together. Golf, soccer, swimming, jumprope, Korean drums, and violin.',tip:'나열할 땐 단어마다 살짝 올리고(↗) 마지막 violin에서 내려요(↘).'},
{w:'MC2',t:'From spring to summer, fall and winter, we had so much fun throughout the year. Global experience day with Tony and Mari teachers. English recital days. Interview with Zoe. Market day and Halloween. What a splendid year we had!'},
{w:'MC1',t:'We smiled, we laughed and we made so many wonderful memories together.',tip:'smiled, laughed, memories를 따뜻하게. 마지막 together에서 내려요.'},
{w:'MC2',t:"And now, the fun isn't over yet! Let's keep the fun going!"},
{w:'MC1',both:1,t:'Enjoy the rest of the show! Thank you!',tip:'MC2와 함께 한 호흡으로! Thank you가 가장 크게, 웃으며 인사.'}];
const QA=[
{q:'What was your favorite thing this year?',a:'My favorite thing was Halloween. I dressed up and had so much fun with my friends.'},
{q:'Which activity did you like the most, golf, soccer, swimming, or violin?',a:'I liked soccer the most because I played with my friends.'},
{q:'What did you do on Global experience day?',a:'I met Tony and Mari teachers and learned about other countries. It was so much fun.'},
{q:'How was the interview with Zoe?',a:'It was exciting. I was a little nervous, but I tried my best.'},
{q:'What did you do on Market day?',a:'I sold things and talked to customers. I learned a lot about money.'},
{q:'Were you nervous today?',a:"Yes, a little. But I'm happy to be here with my friends."},
{q:'What did you learn this year?',a:'I learned to speak English with confidence.'},
{q:'What do you want to do next year?',a:'I want to learn more English and make more friends.'}];
const TIPS={harvard:'Harvard는 "하-버드", r은 혀를 살짝 말아요.',wonderful:'wonderful은 WON에 힘! "원-더-풀"',splendid:'splendid는 "스플렌-디드", splen에 힘!',throughout:'throughout은 th를 혀끝으로 살짝 물고 "쓰루-아웃"',memories:'memories는 "메-머-리즈", 첫 mem에 힘!',jumprope:'jumprope는 "점프롭"을 붙여서!',halloween:'Halloween은 "핼러-윈", Hal에 힘!',together:'together는 "투-게-더", 가운데 GE에 힘!',violin:'violin은 "바이올-린", 첫 vi에 힘!',amazing:'amazing은 "어-메이-징", MAY에 힘!'};
const S={i:-1,m:'r',tok:0,hint:false,q:[],qi:0,busy:false,stop:null};
const ALL=['bStart','bModel','bRec','bStop','bHint','bAsk','bNext'];
const setB=(...a)=>ALL.forEach(id=>$('#'+id).hidden=!a.includes(id));
const status=t=>$('#status').textContent=t;
const nm=()=>$('#n1').value.trim()||'Hunter';
const lvl=()=>+$('#lvl').value;
const txt=i=>L[i].t.replace('{n1}',nm()).replace('{n2}',$('#n2').value.trim()||'Emily');
// ---- 음성 출력
let V=[];const loadV=()=>{V=speechSynthesis.getVoices()};loadV();speechSynthesis.onvoiceschanged=loadV;
function pick(k){const e=V.filter(v=>/^en/i.test(v.lang)),us=e.filter(v=>/en[-_]US/i.test(v.lang));
const re=k==='mc2'?/Samantha|Google US English|Aria|Jenny|Zira|Ava|Allison/i:/Daniel|Google UK English Male|Alex|Guy|David|Mark|Fred|Aaron/i;
return e.find(v=>re.test(v.name))||us[k==='mc2'?0:Math.min(1,us.length-1)]||e[0]||null}
function say(t,l,k){return new Promise(r=>{const u=new SpeechSynthesisUtterance(t);
if(l==='ko'){u.lang='ko-KR';const v=V.find(v=>/^ko/i.test(v.lang));if(v)u.voice=v;u.pitch=1.1}
else{u.lang='en-US';const v=pick(k);if(v)u.voice=v;u.rate=+$('#rate').value;u.pitch=k==='mc2'?1.05:k==='aud'?.85:1}
u.onend=u.onerror=()=>r();speechSynthesis.speak(u)})}
async function sp(parts){const tk=S.tok;for(const p of parts){if(tk!==S.tok)return false;await say(p.t,p.l,p.k)}return tk===S.tok}
function stopAll(){S.tok++;speechSynthesis.cancel();if(S.stop)S.stop()}
// ---- 화면
const hintTxt=s=>lvl()===1?s:lvl()===2?s.replace(/[A-Za-z']+/g,w=>w[0]+'_'.repeat(w.length-1)):S.hint?s:'🙈 대본을 가렸어요. 외워서 말해 보세요!';
function render(){const r=S.m==='r',i=S.i,w=$('#who'),t=$('#text'),tp=$('#tip');
const n=r?L.length:S.q.length,c=r?i:S.qi;
$('#dots').innerHTML=Array.from({length:n||7},(_,k)=>`<span class="${k<c?'d':k===c?'c':''}"></span>`).join('');
$('#res').innerHTML='';$('#live').textContent='';tp.textContent='';
if(r){if(i<0||i>=L.length){w.textContent='🎬 준비';w.style.background='var(--mute)';t.textContent=i<0?'MC1은 Hunter, MC2는 Claude! 번갈아 말하며 대본을 외워 봐요.':'🎉 대본 끝! 정말 잘했어요.';return}
const x=L[i],h=x.w==='MC1';w.textContent=x.both?'MC1 + MC2 함께':h?'MC1 · '+nm():'MC2 · Claude';w.style.background=h?'var(--hunter)':'var(--mc2)';
t.textContent=h?hintTxt(txt(i)):txt(i);tp.textContent=h&&x.tip?'💡 '+x.tip:''}
else{w.style.background='var(--mc2)';w.textContent='👥 관객 질문';
if(!S.q.length)t.textContent='대본을 다 외웠다면, 관객이 물어볼 만한 질문에 영어로 대답해 봐요!';
else if(S.qi>=S.q.length){t.textContent='🎉 모든 질문 끝! 대단해요.'}
else{t.textContent=S.q[S.qi].q;tp.textContent='💡 정답은 없어요. 내 경험을 because(왜냐하면)를 넣어 한 문장 이상으로!'}}}
function ready(){status('🎤 '+nm()+(S.m==='r'?' 차례! 크게, 자신 있게!':', 대답해 볼까요?'));
S.m==='r'?setB('bModel','bRec',...(lvl()===3?['bHint']:[])):setB('bModel','bRec','bAsk')}
// ---- 대본 연습 흐름
async function startR(){stopAll();S.m='r';S.i=0;render();setB();
if(await sp([{t:`${nm()}, 안녕! 지금부터 MC 연습을 시작할게. 목소리는 크게, 얼굴은 웃으면서, 자신 있게! 틀려도 괜찮아. 나는 MC2를 맡을게.`,l:'ko'}]))go(0)}
async function go(i){stopAll();S.i=i;S.hint=false;render();$('#bNext').textContent='➡ 다음으로';
if(i>=L.length)return finish();
if(L[i].w==='MC2'){setB();status('🎧 MC2 (Claude)가 말하는 중…');if(await sp([{t:txt(i),k:'mc2'}]))go(i+1);return}
ready()}
async function finish(){S.i=L.length;render();setB('bStart','bNext');$('#bStart').textContent='🔁 처음부터 다시';$('#bNext').textContent='👥 관객 질문 연습';status('');
await sp([{t:`${nm()}, 대본을 끝까지 해냈어요! 정말 멋졌어요. 다 외웠다는 생각이 들면 관객 질문 연습을 해 볼까요?`,l:'ko'}])}
// ---- 녹음/분석
function listen(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
return new Promise(async res=>{let stream=null,ctx,an,buf,vals=[],tx='',last=Date.now(),done=false,rec=null,iv;const t0=Date.now();
try{if($('#mt').value==='0')throw 0;stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:false,autoGainControl:false}});ctx=new(window.AudioContext||window.webkitAudioContext)();an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);buf=new Float32Array(1024)}catch(e){stream=null;an=null}
const fin=()=>{if(done)return;done=true;clearInterval(iv);S.stop=null;try{rec&&rec.stop()}catch(e){}
stream&&stream.getTracks().forEach(t=>t.stop());ctx&&ctx.close().catch(()=>{});$('#bar').style.width='0';
const v=vals.filter(x=>x>.015);res({tx:tx.trim(),avg:v.length?v.reduce((a,b)=>a+b)/v.length:0,hasMic:!!stream,hasSR:!!SR,voiced:v.length})};
S.stop=fin;
if(SR){rec=new SR();rec.lang='en-US';rec.continuous=true;rec.interimResults=true;
rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript+' ';tx=t;last=Date.now();$('#live').textContent='👂 '+t};
rec.onend=()=>{if(!done)setTimeout(fin,200)};try{rec.start()}catch(e){}}
iv=setInterval(()=>{if(an){an.getFloatTimeDomainData(buf);let s=0;for(const x of buf)s+=x*x;const r=Math.sqrt(s/buf.length);vals.push(r);$('#bar').style.width=Math.min(100,r*600)+'%';if(r>.02)last=Date.now()}
const spoke=tx||(!SR&&vals.filter(x=>x>.02).length>8);
if(Date.now()-t0>30000||(spoke&&Date.now()-last>2200))fin()},80)})}
const norm=s=>s.toLowerCase().replace(/jump rope/g,'jumprope').replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
function lcs(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));
for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
const h=new Set();let i=m,j=n;while(i&&j){if(a[i-1]===b[j-1]){h.add(i-1);i--;j--}else if(d[i-1][j]>=d[i][j-1])i--;else j--}return h}
const vol=r=>(!r.hasMic||!r.voiced)?null:r.avg<.03?'low':r.avg<.06?'mid':'good';
const CLOSE=()=>{const n=nm();return[`${n}, 잘하고 있어요! 넌 할 수 있어!`,`${n}, 자신감 있게! 다음엔 더 멋질 거예요!`,`${n}, 조금씩 좋아지고 있어요. 끝까지 파이팅!`][Math.random()*3|0]};
function fbR(res){const exp=norm(txt(S.i)),P=[],F=[],parts=[];let sc=null,miss=[];
if(res.tx){const h=lcs(exp,norm(res.tx));sc=h.size/exp.length;miss=[...new Set(exp.filter((w,k)=>!h.has(k)&&w.length>3))].slice(0,3)}
const v=vol(res);
if(!res.hasMic)F.push('목소리는 더 크게! 맨 뒤 관객에게 들려준다고 생각해 봐요.');
P.push(sc===null?'끝까지 용기 있게 말해 줬어요!':sc>=.9?'거의 완벽하게 외웠어요!':sc>=.7?'대본을 잘 기억하고 있어요!':'용기 내서 끝까지 말한 게 정말 멋져요!');
if(v==='good')P.push('목소리가 크고 자신감 있었어요!');else if(v==='mid')P.push('목소리가 잘 들렸어요.');
if(v==='low')F.push('목소리가 조금 작아요. 배에 힘을 주고, 맨 뒤 관객에게 들려준다고 생각하며 더 크게!');else if(v==='mid')F.push('한 단계만 더 크게 말해 볼까요?');
if(res.hasSR&&!res.tx)F.push('소리가 잘 인식되지 않았어요. 마이크 가까이에서 또박또박 다시 해 봐요.');
else if(sc!==null&&sc<.7&&!miss.length)F.push('대본을 한 번 더 보고 천천히 말해 봐요.');
const spoken=F.slice();
if(miss.length)F.push('빠지거나 다르게 들린 단어: '+miss.join(', '));
const tips=miss.map(w=>TIPS[w]).filter(Boolean).slice(0,2);
if(!F.length)F.push('이제 표정과 억양만 더 살리면 완벽해요!'),spoken.push(F[0]);
parts.push({t:P.join(' '),l:'ko'});spoken.forEach(t=>parts.push({t,l:'ko'}));
if(miss.length){parts.push({t:'이 단어들을 다시 한번 들어 봐요.',l:'ko'});miss.forEach(w=>parts.push({t:w,k:'mc1'}));tips.forEach(t=>parts.push({t,l:'ko'}))}
parts.push({t:CLOSE(),l:'ko'});
return{P,F,tips,sc,parts,pass:sc!==null&&sc>=.7&&v!=='low'}}
function fbQ(res){const P=[],F=[],v=vol(res),n=norm(res.tx||'').length;
P.push(res.tx?(n>=6?'완전한 문장으로 대답했어요! 아주 좋아요.':'대답해 줘서 고마워요!'):'끝까지 대답해 줘서 멋져요!');
if(v==='good')P.push('목소리도 크고 자신감 있었어요!');else if(v==='mid')P.push('목소리가 잘 들렸어요.');
if(res.tx&&n<6)F.push('한 문장 이상으로 길게! because를 넣어서 이유까지 말해 봐요.');
if(v==='low')F.push('목소리가 조금 작아요. 맨 뒤 관객에게 들려준다고 생각하며 더 크게!');else if(v==='mid')F.push('한 단계만 더 크게 말해 볼까요?');
if(res.hasSR&&!res.tx)F.push('소리가 잘 인식되지 않았어요. 마이크 가까이에서 다시 해 봐요.');
if(!F.length)F.push('좋아요! 대답 앞에 "Good question!"을 붙이면 더 여유 있어 보여요.');
return{P,F,tips:[],sc:null,parts:[{t:P.join(' '),l:'ko'},...F.map(t=>({t:t.replace(/"Good question!"/,'굿 퀘스천'),l:'ko'})),{t:CLOSE(),l:'ko'}],pass:false}}
function show(f){$('#res').innerHTML=`<div class="fb ok">✅ ${f.P.join(' ')}${f.sc!==null?` <b>(대본 일치 ${Math.round(f.sc*100)}%)</b>`:''}</div><div class="fb fix">🛠 ${f.F.join('<br>')}${f.tips.length?'<br>💡 '+f.tips.join('<br>💡 '):''}</div>`}
// ---- 버튼
$('#bRec').onclick=async()=>{if(S.busy)return;stopAll();const tk=S.tok;S.busy=true;
status('🎙 듣고 있어요… 다 말하면 [다 말했어요]!');setB('bStop');$('#res').innerHTML='';
const res=await listen();S.busy=false;if(tk!==S.tok)return;
setB();status('🤔 잘 들었어요…');
const f=S.m==='r'?fbR(res):fbQ(res);show(f);
if(!await sp(f.parts))return;
if(S.m==='r'&&f.pass)return go(S.i+1);
status(S.m==='r'?'다시 해 볼래요, 아니면 다음으로 갈까요?':'다시 대답해 보거나 다음 질문으로!');
S.m==='r'?setB('bModel','bRec','bNext'):setB('bModel','bRec','bAsk','bNext');$('#bRec').textContent='🎙 다시 말하기'};
$('#bStop').onclick=()=>S.stop&&S.stop();
$('#bModel').onclick=async()=>{stopAll();setB();status('🔊 잘 듣고 따라 해 봐요…');
const ok=await sp([{t:S.m==='r'?txt(S.i):S.q[S.qi].a,k:'mc1'}]);if(S.m==='q')$('#tip').textContent='🔊 예시: '+S.q[S.qi].a+' (내 경험에 맞게 바꿔도 좋아요)';if(ok)ready()};
$('#bHint').onclick=()=>{S.hint=true;render();setB('bModel','bRec')};
$('#bAsk').onclick=async()=>{stopAll();setB();status('👥 관객 질문');if(await sp([{t:S.q[S.qi].q,k:'aud'}]))ready()};
$('#bNext').onclick=()=>{if(S.m==='r')return S.i>=L.length?mode('q'):go(S.i+1);S.qi++;render();S.qi>=S.q.length?(setB('bStart'),$('#bStart').textContent='🔁 질문 다시',status('')):ask()};
$('#bStart').onclick=()=>S.m==='r'?startR():startQ();
async function ask(){stopAll();render();setB();$('#bRec').textContent='🎙 말하기';status('👥 관객 질문을 들어요…');if(await sp([{t:S.q[S.qi].q,k:'aud'}]))ready()}
async function startQ(){stopAll();S.m='q';S.q=[...QA].sort(()=>Math.random()-.5);S.qi=0;render();setB();
if(await sp([{t:'자, 이제 관객 질문 시간이에요! 질문을 잘 듣고 자신 있게 대답해 봐요. 정답은 없고, 내 경험을 말하면 돼요.',l:'ko'}]))ask()}
function mode(m){stopAll();S.m=m;S.busy=false;S.i=-1;S.q=[];S.qi=0;$('#t1').className=m==='r'?'on':'';$('#t2').className=m==='q'?'on':'';
render();setB('bStart');$('#bStart').textContent=m==='r'?'▶ 연습 시작':'▶ 관객 질문 시작';$('#bRec').textContent='🎙 말하기';status('')}
$('#t1').onclick=()=>mode('r');$('#t2').onclick=()=>mode('q');
if(!('speechSynthesis' in window))status('⚠️ 이 브라우저는 음성 읽기를 지원하지 않아요. Chrome이나 Safari를 써 주세요.');
if(/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))$('#mt').value='0';
mode('r');
